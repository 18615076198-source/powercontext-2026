app:
  description: 把相亲简历丢进缘分交易所，AI 月老用 seekdb 混合检索在 24 位奇葩角色里撮合，并把每次批语写进档案——下次它还记得你上次为什么黄了。
  icon: 💘
  icon_background: '#FFE4E6'
  mode: advanced-chat
  name: 赛博月老·缘分交易所
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 月老在的。把简历丢过来，或者先说一句「查档案」。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 帮我撮合一下：程序员，喜欢猫和手冲咖啡，周末想去看展
    - 查一下我的相亲档案
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: if-else
      id: 1700000000001-source-1700000000002-target
      selected: false
      source: '1700000000001'
      sourceHandle: source
      target: '1700000000002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: http-request
      id: 1700000000002-true-1700000000007-target
      selected: false
      source: '1700000000002'
      sourceHandle: 'true'
      target: '1700000000007'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: http-request
      id: 1700000000002-false-1700000000003-target
      selected: false
      source: '1700000000002'
      sourceHandle: 'false'
      target: '1700000000003'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: llm
      id: 1700000000007-source-1700000000008-target
      selected: false
      source: '1700000000007'
      sourceHandle: source
      target: '1700000000008'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: answer
      id: 1700000000008-source-1700000000009-target
      selected: false
      source: '1700000000008'
      sourceHandle: source
      target: '1700000000009'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: llm
      id: 1700000000003-source-1700000000004-target
      selected: false
      source: '1700000000003'
      sourceHandle: source
      target: '1700000000004'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: http-request
      id: 1700000000004-source-1700000000005-target
      selected: false
      source: '1700000000004'
      sourceHandle: source
      target: '1700000000005'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
