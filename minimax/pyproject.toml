[project]
name = "sddctx"
version = "0.1.0"
description = "规有所依：面向软件持续演进的 SDD 上下文管理系统（MiniMax × OceanBase 赛题）"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
seekdb = ["pyseekdb>=1.4,<2"]
dev = ["pytest>=8"]

[project.scripts]
sddctx = "sddctx.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
